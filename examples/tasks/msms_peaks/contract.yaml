# MS/MS peak prediction: a variable-length peak list per spectrum.
# Shows: list outputs (records with max_items) and list answers given as JSON
# in a CSV column, e.g. {"mz": [57.1, 85.0], "intensity": [0.4, 1.0]}.
# Provider data: one table with the columns below.
id: msms_peaks
version: 1
title: MS/MS peak prediction (example)
description: Predict the MS/MS peak list (m/z and normalized intensity) for each precursor.
key: [spectrum_id]
inputs:
  - {name: spectrum_id, type: string}
  - {name: smiles, type: string}
  - {name: precursor_mz, type: float, min: 0}
  - {name: collision_energy, type: float, min: 0}
outputs:
  - name: peaks
    type: list
    max_items: 100
    items:
      - {name: mz, type: float, min: 0, max: 5000}
      - {name: intensity, type: float, min: 0, max: 1}
answers:
  - {name: spectrum_id, type: string}
  - name: true_peaks
    type: list
    max_items: 1000
    items:
      - {name: mz, type: float}
      - {name: intensity, type: float}
metrics:
  - {name: cosine_mean, type: float, min: 0, max: 1, goal: max}
headline: cosine_mean
export: {decimals: 3}
limits: {submissions_per_day: 20, submissions_total: 200}
