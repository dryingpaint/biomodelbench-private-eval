[project]
name = "bmb-eval"
version = "0.2.1"
description = "BioModelBench private evaluation node: score agent-trained models on private data without the data leaving the provider."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2",
    "pyarrow>=14",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
hub = ["google-cloud-storage>=2.14", "markdown>=3.5"]   # the hub: Cloud Storage, web pages
# Providers sealing data (confidential mode). cryptography 49+ has no Intel-Mac wheels
# (it would need a Rust compiler there), so Intel Macs stay on 48.
seal = ["cryptography>=42; sys_platform != 'darwin' or platform_machine != 'x86_64'",
        "cryptography>=42,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[project.scripts]
bmb-eval = "bmb_eval.cli:main"
bmb-hub = "bmb_eval.hub:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmb_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
