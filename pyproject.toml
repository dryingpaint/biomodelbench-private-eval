[project]
name = "bmb-eval"
version = "0.1.0"
description = "BioModelBench private evaluation node: score agent-trained models on private data without the data leaving the provider."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2",
    "pyarrow>=14",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
hub = ["google-cloud-storage>=2.14"]   # the hub, when model files live in Cloud Storage

[project.scripts]
bmb-eval = "bmb_eval.cli:main"
bmb-hub = "bmb_eval.hub:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmb_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
